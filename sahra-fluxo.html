<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fluxo da SAHRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=202611101923"></script>
<style>
/* Layout: duas vistas. Editor = quadro de macroetapas em colunas + painel da etapa. Mesa = SAHRA de um lado, conversa no meio, ficha do projeto do outro. */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --line:#dcd9d1; --ink:#1f1d1a; --muted:#6c6860;
  --accent:#7a4a22; --accent-soft:#f1e6da; --decision:#4b4f8a; --decision-soft:#e9e9f5;
  --ok:#2f6b4f; --danger:#a3352b; --hl:#fff4d6; --photo:#ffffff; --table:#e9e4da; --vidro:rgba(255,255,255,.72); --vidro-forte:rgba(246,243,238,.9); --vidro-borda:rgba(255,255,255,.55);
  --f-display:"Familjen Grotesk",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171614; --surface:#211f1c; --line:#3a3732; --ink:#ece9e2; --muted:#a29d93;
  --accent:#d9a571; --accent-soft:#3a2b1d; --decision:#aeb2ee; --decision-soft:#2a2b42;
  --ok:#7cc3a0; --danger:#ec8a80; --hl:#3a3220; --photo:#f4f2ee; --table:#2a2622; --vidro:rgba(28,25,22,.72); --vidro-forte:rgba(28,25,22,.9); --vidro-borda:rgba(255,255,255,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171614; --surface:#211f1c; --line:#3a3732; --ink:#ece9e2; --muted:#a29d93;
  --accent:#d9a571; --accent-soft:#3a2b1d; --decision:#aeb2ee; --decision-soft:#2a2b42;
  --ok:#7cc3a0; --danger:#ec8a80; --hl:#3a3220; --photo:#f4f2ee; --table:#2a2622; --vidro:rgba(28,25,22,.72); --vidro-forte:rgba(28,25,22,.9); --vidro-borda:rgba(255,255,255,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font:600 20px/1.1 var(--f-display);margin:0}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px}
.tab{border:0;background:none;padding:6px 12px;border-radius:6px;font-size:14px;color:var(--muted)}
.tab[aria-current="page"]{background:var(--accent);color:var(--surface)}
header.edhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font:600 26px/1.1 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0;max-width:62ch}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.status{font:12px var(--f-mono);color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.main.has-panel{grid-template-columns:minmax(0,1fr) minmax(320px,440px)}
@media (max-width:860px){.main.has-panel{grid-template-columns:minmax(0,1fr)}}
.board-scroll{overflow-x:auto;padding-bottom:8px}
.board{display:flex;gap:14px;align-items:flex-start;min-height:200px}
.col{flex:0 0 260px;background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col-head{display:flex;align-items:center;gap:8px}
.col-num{font:500 12px var(--f-mono);color:var(--accent)}
.col-name{font:600 15px var(--f-display);flex:1;min-width:0;background:none;border:0;padding:2px 0;text-align:left;overflow-wrap:anywhere}
.col-name-input{flex:1;min-width:0;font:600 15px var(--f-display);border:1px solid var(--line);border-radius:4px;padding:2px 6px;background:var(--surface);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.card:hover{border-color:var(--muted)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card.linked{background:var(--hl)}
.code{font:500 11px var(--f-mono);color:var(--muted)}
.card-title{font-weight:500;overflow-wrap:anywhere}
.card-q{font-size:13px;color:var(--decision);background:var(--decision-soft);border-radius:4px;padding:3px 6px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted);overflow-wrap:anywhere}
.chip.to{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.add-step{border:1px dashed var(--line);background:none;border-radius:8px;padding:8px;color:var(--muted);font-size:13px}
.add-step:hover{color:var(--ink);border-color:var(--muted)}
.add-col{flex:0 0 200px;border:1px dashed var(--line);border-radius:10px;background:none;padding:18px 10px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--surface)}
.empty h2{font:600 19px var(--f-display);margin:0}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;align-self:start;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-head h2{font:600 18px var(--f-display);margin:0}
.field{display:flex;flex-direction:column;gap:4px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:6px;align-items:center}
.lbl .tag{font:500 10px var(--f-mono);padding:0 5px;border-radius:3px;letter-spacing:0}
.t-in{background:var(--accent-soft);color:var(--accent)}
.t-dec{background:var(--decision-soft);color:var(--decision)}
.t-out{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.hint{font-size:12px;color:var(--muted);margin:0}
input[type=text],textarea,select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{resize:vertical;min-height:62px}
.saida{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--surface) 60%,var(--bg))}
.saida-head{display:flex;justify-content:space-between;align-items:center}
.saida-head b{font:500 12px var(--f-mono);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--danger);flex-wrap:wrap}
.err{color:var(--danger);font-size:13px}

/* Mesa */
.lobby{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.lobby{grid-template-columns:minmax(0,1fr)}}
.portrait{background:var(--photo);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;justify-content:center}
.portrait img{display:block;width:100%;max-width:320px;height:auto}
.lobby-intro h1{font-size:30px}
.lobby-intro p{max-width:56ch;color:var(--muted)}
.proj-list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.proj{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;width:100%}
.proj:hover{border-color:var(--muted)}
.proj small{color:var(--muted);font:12px var(--f-mono)}
.pill{font:500 11px var(--f-mono);padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.done{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}

.mesa{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1080px){.mesa{grid-template-columns:200px minmax(0,1fr)}.ficha-col{grid-column:1 / -1}}
@media (max-width:700px){.mesa{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:700px){.side{position:static;flex-direction:row;align-items:center}.side .portrait{width:84px;flex:0 0 84px;border-radius:50%}.side .steps{display:none}}
.who{display:flex;flex-direction:column;gap:2px}
.who b{font:600 17px var(--f-display)}
.who span{font-size:13px;color:var(--muted)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.now .code{display:block}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.steps li{display:flex;gap:8px;align-items:center;color:var(--muted);padding:3px 0}
.steps li::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid var(--muted);flex:0 0 8px}
.steps li.past{color:var(--ink)}
.steps li.past::before{background:var(--ok);border-color:var(--ok)}
.steps li.cur{color:var(--accent);font-weight:500}
.steps li.cur::before{background:var(--accent);border-color:var(--accent)}

.chat{background:var(--table);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:min(70vh,640px)}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;max-height:68vh}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(92%,620px)}
.msg.cli{align-self:flex-end;flex-direction:row-reverse}
.ava{width:34px;height:34px;border-radius:50%;background:var(--photo) center 30%/150% no-repeat;flex:0 0 34px;border:1px solid var(--line)}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:9px 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.cli .bub{background:var(--accent-soft);border-color:transparent;border-radius:12px 12px 4px 12px}
.bub .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.bub .imgs img{width:96px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg)}
.trace{align-self:center;font:11px var(--f-mono);color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:3px 8px;max-width:100%;overflow-wrap:anywhere}
.trace b{color:var(--decision);font-weight:500}
.typing{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.typing i{display:inline-flex;gap:3px}
.typing i::before,.typing i::after,.typing i span{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block}
@media (prefers-reduced-motion:no-preference){.typing i::before,.typing i::after,.typing i span{animation:blink 1.2s infinite}.typing i span{animation-delay:.2s}.typing i::after{animation-delay:.4s}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.perg{margin:8px 0 0;padding:8px 10px 8px 30px;background:var(--decision-soft);color:var(--decision);border-radius:8px;display:flex;flex-direction:column;gap:6px;font-weight:500;white-space:normal}
.perg li::marker{font:500 12px var(--f-mono)}
.decide{margin-top:8px;font-size:13px;padding:5px 10px;border-color:var(--decision);color:var(--decision);background:var(--surface)}
.anel{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.anel div{display:flex;flex-direction:column}
.anel b{font:600 22px var(--f-display);font-variant-numeric:tabular-nums}
.anel span{font-size:13px;color:var(--muted)}
.barra{height:4px;background:var(--line);border-radius:14px 14px 0 0;overflow:hidden}
.barra i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.barra i{transition:width .6s ease}}
@media (min-width:701px){.barra{display:none}}
@media (max-width:700px){.side .anel{display:none}}
.pv{margin-top:24px;display:flex;flex-direction:column;gap:16px}
.pv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pv-head h2{font:600 22px var(--f-display);margin:0}
.conceito{font-size:16px;max-width:70ch;margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px 6px 6px}
.sw i{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);flex:0 0 32px}
.sw span{display:flex;flex-direction:column;font-size:13px}
.sw small{color:var(--muted)}
.parede{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.parede figcaption{font:600 15px var(--f-display);margin-bottom:6px}
.elev-wrap{overflow-x:auto}
.elev{width:100%;min-width:480px;height:auto;display:block}
.legenda{margin:-6px 0 0}
.pv-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.pv-grid{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .mono{font-family:var(--f-mono)}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.conf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.conf b{display:inline-block;width:18px;text-align:center}
.conf .ok b{color:var(--ok)} .conf .no b{color:var(--danger)}
.conf small{display:block;color:var(--muted);margin-left:22px}
.pick{margin:8px 0}
.thumb{padding:0;border:2px solid transparent;border-radius:8px;background:none;line-height:0}
.thumb img{width:96px;height:72px;object-fit:cover;border-radius:6px}
.thumb.sel{border-color:var(--accent)}
.thumb.proj{width:100px;height:76px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);border-color:var(--line);font-size:12px;line-height:1.2;text-align:center;color:var(--accent)}
.thumb.proj small{color:var(--muted)}
.renders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;margin-top:12px}
.renders figure{margin:0}
.renders img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.render pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;max-height:220px;overflow:auto}
.render .row{align-items:center}
.ajuste .row{margin-top:8px}
.ajuste textarea{background:var(--bg)}
.pvbox .btn{margin-top:8px;width:100%}

/* Mesa imersiva: a cena da SAHRA no escritório ocupa a tela; a conversa fica sobre a mesa */
.cena{position:relative;border-radius:16px;overflow:hidden;height:clamp(560px,calc(100vh - 140px),1000px);background:#2b2520 url("assets/sahra/fluxo/sahra-escritorio.jpg") center 18%/cover no-repeat;isolation:isolate}
.cena::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(20,14,10,.45) 100%)}
.cena-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;z-index:3}
.chip-prog{display:flex;align-items:center;gap:10px;background:var(--vidro);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--vidro-borda);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--ink)}
.chip-prog b{font:600 17px var(--f-display);font-variant-numeric:tabular-nums}
.chip-prog small{display:block;color:var(--muted);font-size:12px}
.mini-anel{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px);flex:0 0 30px}
.cena-acoes{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.cena-acoes .voz{background:var(--vidro);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--vidro-borda);border-radius:12px;padding:6px;flex-direction:row;align-items:center}
.cena-acoes .voz .row{gap:6px}
.cena-acoes .btn{white-space:nowrap}
@media (min-width:901px){.cena.ficha-aberta .chat-mesa{left:14px;transform:none;width:calc(100% - 28px - 362px)}}
.cena-acoes .voz .muted{margin:0 4px;max-width:220px}
.cena-acoes .voz .muted:empty{display:none}
.btn.vidro{background:var(--vidro);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-color:var(--vidro-borda)}
.ficha-gaveta{position:absolute;top:72px;right:14px;bottom:14px;width:min(340px,calc(100% - 28px));overflow:auto;z-index:4;display:flex;flex-direction:column;gap:10px;background:var(--vidro-forte);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--vidro-borda);border-radius:14px;padding:12px}
.ficha-gaveta .box{background:var(--surface)}
.ficha-gaveta .steps{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chat-mesa{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(780px,calc(100% - 28px));height:min(50%,520px);display:flex;flex-direction:column;z-index:2;background:var(--vidro);backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);border:1px solid var(--vidro-borda);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.chat-mesa .msgs{flex:1;max-height:none;padding:6px 16px 14px}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 0 16px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.btn.icone{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:10px}
.chat-head .btn.icone{width:32px;height:32px;background:var(--surface)}
.chat-mesa.min{height:auto}
.btn.mic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;color:var(--accent)}
.btn.mic.rec{background:#b3261e;border-color:#b3261e;color:#fff}
@media (prefers-reduced-motion:no-preference){.btn.mic.rec{animation:pulsa 1.2s ease-in-out infinite}}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{box-shadow:0 0 0 8px rgba(179,38,30,0)}}

<div class="wrap">

    <p class="brand">SAHRA · Legno</p>
    <nav class="tabs" aria-label="Vistas">
      <button class="tab" id="tab-fluxo">Editor do fluxo</button>
      <button class="tab" id="tab-mesa">Mesa da SAHRA</button>
    </nav>
  </div>

  <section id="view-fluxo">
    <header class="edhead">
      <div>
        <h1>Fluxo da SAHRA</h1>
        <p class="sub">Cada etapa recebe uma entrada, faz um processo, toma uma decisão e manda pra uma das saídas. A Mesa da SAHRA segue exatamente este fluxo.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div class="legend">
          <span><i class="dot" style="background:var(--accent)"></i>Entrada / processo</span>
          <span><i class="dot" style="background:var(--decision)"></i>Decisão</span>
          <span><i class="dot" style="background:var(--ok)"></i>Saídas</span>
        </div>
        <div class="status" id="status">Carregando o fluxo…</div>
      </div>
    </header>

      <div class="board-scroll"><div class="board" id="board"></div></div>
      <aside class="panel" id="panel" hidden></aside>
    </div>

  <section id="view-mesa" hidden></section>
</div>

<script>
const SPECIAL = [
  {id:"__cliente", nome:"Perguntar ao cliente"},
  {id:"__revisao", nome:"Marcar pra revisão do Matt"},
  {id:"__fim", nome:"Fim do fluxo"}
];
const GRUPO_PARADA = "projeto-virtual"; // o protótipo da mesa para ao chegar aqui
const GRUPO_MONTAR = "montar-portal"; // regras do Matt pra transformar o virtual em projeto do portal (migration 273)
const st = {db:null, grupos:[], etapas:[], sel:null, draft:null, dirty:false, editingCol:null, confirmDel:false, loaded:{g:false,e:false}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function grupoIdx(gid){ return st.grupos.findIndex(g=>g.id===gid); }
function grupoOrdem(gid){ const g=st.grupos.find(x=>x.id===gid); return g?g.ordem:0; }
function etapasDo(gid){ return st.etapas.filter(e=>e.grupo===gid).sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }
function codigo(e){ const gi=grupoIdx(e.grupo); const i=etapasDo(e.grupo).findIndex(x=>x.id===e.id); return gi<0?"–":`${gi+1}.${i+1}`; }
function nomeDestino(id){
  const s=SPECIAL.find(x=>x.id===id); if(s) return s.nome;
  const e=st.etapas.find(x=>x.id===id); return e ? `${codigo(e)} ${e.nome||"Sem nome"}` : "";
}
function setStatus(t){ $("#status").textContent=t; }

/* ---------- Navegação ---------- */
function route(){
  const h=location.hash.replace("#","");
  const mesa=h.startsWith("mesa");
  $("#view-fluxo").hidden=mesa; $("#view-mesa").hidden=!mesa;
  $("#tab-fluxo").setAttribute("aria-current", mesa?"false":"page");
  $("#tab-mesa").setAttribute("aria-current", mesa?"page":"false");
  M.pid = h.startsWith("mesa-") ? h.slice(5) : null;
  if(mesa) renderMesa(); else render();
}
$("#tab-fluxo").onclick=()=>{ location.hash="fluxo"; };
$("#tab-mesa").onclick=()=>{ location.hash="mesa"; };
window.addEventListener("hashchange", route);

/* ---------- Editor ---------- */
function render(){
  const board=$("#board");
  if(!st.db){ return; }
  if(!(st.loaded.g && st.loaded.e)) return;
  if(!st.grupos.length){
    board.innerHTML = `<div class="empty" style="flex:1">
      <h2>Nenhuma macroetapa ainda</h2>
      <p>Comece pelas grandes fases de um projeto, na ordem em que um projetista trabalha. Depois abra as etapas de decisão dentro de cada uma.</p>
      <button class="btn primary" id="first">Criar a primeira macroetapa</button></div>`;
    $("#first").onclick=addGrupo; renderPanel(); return;
  }
  const sel=st.sel && st.etapas.find(e=>e.id===st.sel);
  const linked=new Set();
  if(sel){ (sel.saidas||[]).forEach(s=>s.destino&&linked.add(s.destino));

  board.innerHTML = st.grupos.map((g,gi)=>`

function draftDe(e){ return JSON.parse(JSON.stringify({nome:e.nome||"",grupo:e.grupo,entrada:e.entrada||"",processo:e.processo||"",decisao:e.decisao||"",saidas:e.saidas||[],notas:e.notas||""})); }
function selecionar(id){
  if(st.dirty && st.sel!==id){ const w=$("#unsaved"); if(w) w.hidden=false; return; }
  const e=st.etapas.find(x=>x.id===id); if(!e) return;
  st.sel=id; st.confirmDel=false; st.dirty=false; st.draft=draftDe(e);
  render();
}

      <textarea id="f-decisao" placeholder="Uma pergunta que tenha resposta clara.">${esc(d.decisao)}</textarea></div>

        <input type="text" id="s-porque-${i}" data-s="${i}" data-k="porque" value="${esc(s.porque)}" placeholder="Porque… (o motivo)">

      <div class="row" id="footbtns">
        ${st.dirty?`<button class="btn" id="descartar">Descartar</button>`:""}

  const bind=(id,k)=>{ const el=$(id); el.oninput=()=>{ d[k]=el.value; markDirty(); }; };

  $("#add-saida").onclick=()=>{ d.saidas.push({condicao:"",acao:"",porque:"",destino:""}); st.dirty=true; renderPanel(); $("#s-cond-"+(d.saidas.length-1)).focus(); };

function descartar(){ st.dirty=false; const id=st.sel; st.sel=null; selecionar(id); }
function markDirty(){ if(st.dirty) return; st.dirty=true; const b=$("#salvar"); if(b){ b.disabled=false; b.textContent="Salvar"; }
  if(!$("#descartar")){ const x=document.createElement("button"); x.className="btn"; x.id="descartar"; x.textContent="Descartar"; x.onclick=descartar; $("#footbtns").prepend(x);} }
async function salvar(){
  const d=st.draft, id=st.sel; const b=$("#salvar"); b.disabled=true; b.textContent="Salvando…";
  try{
    const e=st.etapas.find(x=>x.id===id);
    const body={nome:d.nome.trim(),grupo:d.grupo,entrada:d.entrada,processo:d.processo,decisao:d.decisao,
      saidas:d.saidas.map(s=>({condicao:s.condicao||"",acao:s.acao||"",porque:s.porque||"",destino:s.destino||""})),
      notas:d.notas, atualizado:new Date().toISOString()};
    if(e && e.grupo!==d.grupo) body.ordem=Date.now();
    await st.db.doc("etapas/"+id).update(body);
    st.dirty=false; render(); setStatus("Salvo às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  }catch(err){ b.disabled=false; b.textContent="Salvar"; setStatus(err.code==="invalid_argument"?"Você não tem permissão pra editar este fluxo.":"Não foi possível salvar. Tente de novo."); }
}
async function apagarEtapa(){
  try{ await st.db.doc("etapas/"+st.sel).delete(); st.sel=null; st.draft=null; st.dirty=false; st.confirmDel=false; render(); }
  catch(err){ setStatus("Não foi possível apagar. Tente de novo."); }
}
async function addGrupo(){
  try{ const ref=st.db.collection("grupos").doc(); await ref.set({nome:"Nova macroetapa",ordem:Date.now()}); st.editingCol=ref.id; }
  catch(err){ setStatus(err.code==="quota_exceeded"?"O fluxo atingiu o limite de itens.":"Não foi possível criar. Tente de novo."); }
}
async function addEtapa(gid){
  if(st.dirty){ const w=$("#unsaved"); if(w) w.hidden=false; return; }
  try{ const ref=st.db.collection("etapas").doc();
    await ref.set({nome:"Nova etapa",grupo:gid,ordem:Date.now(),entrada:"",processo:"",decisao:"",saidas:[],notas:"",atualizado:new Date().toISOString()});
    selecionar(ref.id); setTimeout(()=>{ const i=$("#f-nome"); if(i){ i.focus(); i.select(); } },0); }
  catch(err){ setStatus(err.code==="quota_exceeded"?"O fluxo atingiu o limite de itens.":"Não foi possível criar. Tente de novo."); }
}

const M = {sample:null, assets:null, imgLimits:null, projetos:[], pid:null, proj:null, busy:false, ctl:null, files:[], blobUrls:{}, erro:""};
const AV_ROSTO="assets/sahra/fluxo/sahra-rosto.png", AV_BUSTO="assets/sahra/fluxo/sahra-busto.png", AV_CORPO="assets/sahra/fluxo/sahra-mesa.png";

function primeiraEtapa(){ for(const g of st.grupos){ const e=etapasDo(g.id)[0]; if(e) return e; } return null; }
function etapaPorId(id){ return st.etapas.find(e=>e.id===id); }
function grupoParadaOrdem(){ return grupoOrdem(GRUPO_PARADA) || Infinity; }
function ehFinal(etapaId){ const e=etapaPorId(etapaId); return e && grupoOrdem(e.grupo) >= grupoParadaOrdem(); }

async function novoProjeto(){
  const e=primeiraEtapa(); if(!e) return;

function progresso(p){
  if(p.status!=="ativo") return 100;
  const e=etapaPorId(p.etapaId); if(!e) return 0;
  const c=Math.min(95,Number(p.completude)||0)/100;
  const gBrief=st.grupos[0]?.id;
  if(e.grupo===gBrief){ const lista=etapasDo(gBrief); const i=Math.max(0,lista.findIndex(x=>x.id===e.id)); const w=50/lista.length; return Math.round(w*i+w*c); }
  if(e.grupo==="ambientes") return Math.round(50+20*c);
  if(e.grupo==="blocos"){
    const nomes=new Set(etapasDo("blocos").map(x=>`${codigo(x)} ${x.nome}`));
    const feitos=(p.trilha||[]).filter(t=>nomes.has(t.de)).length;
    const total=feitos+(p.fila||[]).filter(id=>etapaPorId(id)?.grupo==="blocos").length+1;
    return Math.round(70+28*(feitos+c)/total);
  }
  return 0;
}
function rotuloProgresso(v){ return v>=100?"Briefing completo":v>=75?"Quase lá":v>=35?"No caminho":"Começando"; }
function anelHtml(p){
  const v=progresso(p), r=34, C=2*Math.PI*r;
  return `<div class="anel" role="img" aria-label="Briefing ${v}% completo">
    <svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="42" cy="42" r="${r}" fill="none" stroke="${v>=100?"var(--ok)":"var(--accent)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C*v/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/></svg>
    <div><b>${v}%</b><span>${rotuloProgresso(v)}</span></div></div>`;
}
function stepsHtml(p){
  const cur=etapaPorId(p.etapaId); let curO=cur?grupoOrdem(cur.grupo):0; let curG=cur?.grupo;
  // depois do briefing a fase vem do projeto virtual: aprovado → Montar no portal; montado → Projeto executivo
  if(p.status!=="ativo"){
    const fase = (p.pv?.montagens||[]).length ? "projeto-executivo" : p.pv?.aprovado ? GRUPO_MONTAR : GRUPO_PARADA;
    if(grupoIdx(fase)>=0){ curG=fase; curO=grupoOrdem(fase); }
  }
  return st.grupos.map(g=>{
    const cls = g.id===curG ? "cur" : (p.status!=="ativo" && g.ordem<grupoParadaOrdem()) || g.ordem<curO ? "past" : "";
    return `<li class="${cls}">${esc(g.nome)}</li>`; }).join("");
}

function arquivosLista(p){

    const acab=x.proposta?.acabamentos||[];
    if(temPlanta(p)){ const mv=moveisDaPlanta(p.ficha.planta, x.proposta); if(mv.length) out.push({grupo:`v${x.v}.0 · ${amb}`, nome:"Planta dos móveis", thumb:()=>plantaSvg(p.ficha.planta,true,mv), full:()=>plantaSvg(p.ficha.planta,false,mv), atual:x.v===versaoAtual(p)}); }
    (x.proposta?.paredes||[]).forEach((w,i)=>out.push({grupo:`v${x.v}.0 · ${amb}`, nome:w.nome||`Parede ${i+1}`, thumb:()=>elevSvg(w,acab), full:()=>elevSvg(w,acab), atual:x.v===versaoAtual(p)}));
  }
  for(const r of (p.pv?.renders||[]).slice().reverse()) if(M.blobUrls[r.id]) out.push({grupo:"Imagens realistas", nome:r.v?`v${r.v}.0`:"Imagem", id:r.id, thumb:()=>`<img src="${M.blobUrls[r.id]}" alt="">`, full:()=>`<img src="${M.blobUrls[r.id]}" alt="Imagem realista" draggable="false">`});
  p.mensagens.flatMap(m=>m.img||[]).forEach((id,i)=>out.push({grupo:"Enviados por você", nome:`Foto ${i+1}`, id, thumb:()=>`<img src="${imgSrc(id)}" alt="">`, full:()=>`<img src="${imgSrc(id)}" alt="Foto enviada" draggable="false">`}));
  return out;

function arquivosHtml(p){

/* Visualizador: tela cheia, só a imagem. Roda = zoom no ponto do mouse,

const LUZ={s:1,x:0,y:0,drag:null};
function luzHtml(p){
  if(M.luz==null) return "";

  return `<div class="luz" role="dialog" aria-modal="true" aria-label="${esc(f.nome)}">
    <div class="luz-palco" id="luz-palco"><div class="luz-img ${/<svg/.test(f.full())?"vetor":""}" id="luz-img">${f.full()}</div></div>
    <button class="luz-x" id="luz-x" aria-label="Fechar">×</button>
    ${lista.length>1?`<button class="luz-nav ant" id="luz-ant" aria-label="Imagem anterior">‹</button><button class="luz-nav prox" id="luz-prox" aria-label="Próxima imagem">›</button>`:""}
  </div>`;
}
function luzAplica(){ const el=document.getElementById("luz-img"); if(el) el.style.transform=`translate(${LUZ.x}px,${LUZ.y}px) scale(${LUZ.s})`; }
function luzReset(){ LUZ.s=1; LUZ.x=0; LUZ.y=0; luzAplica(); }
function luzZoom(f, cx, cy){
  const pal=document.getElementById("luz-palco"); if(!pal) return;
  const r=pal.getBoundingClientRect(); const px=(cx??r.left+r.width/2)-r.left-r.width/2, py=(cy??r.top+r.height/2)-r.top-r.height/2;
  const s2=Math.min(8,Math.max(1,LUZ.s*f)); const k=s2/LUZ.s;
  LUZ.x=px-(px-LUZ.x)*k; LUZ.y=py-(py-LUZ.y)*k; LUZ.s=s2; if(s2===1){ LUZ.x=0; LUZ.y=0; } luzAplica();
}
function luzVai(d){ const n=arquivosLista(M.proj).length; if(!n) return; M.luz=(M.luz+d+n)%n; luzReset(); renderConversa($("#view-mesa")); }
function bindLuz(v){
  document.querySelectorAll("[data-luz]").forEach(b=>b.onclick=()=>{ M.luz=Number(b.dataset.luz); LUZ.s=1; LUZ.x=0; LUZ.y=0; renderConversa(v); });
  const pal=document.getElementById("luz-palco"); if(!pal) return;
  luzAplica();
  $("#luz-x").onclick=()=>{ M.luz=null; renderConversa(v); };
  const a=$("#luz-ant"), b=$("#luz-prox"); if(a) a.onclick=()=>luzVai(-1); if(b) b.onclick=()=>luzVai(1);
  pal.addEventListener("wheel",ev=>{ ev.preventDefault(); luzZoom(ev.deltaY<0?1.2:1/1.2, ev.clientX, ev.clientY); },{passive:false});
  pal.ondblclick=ev=>{ if(LUZ.s>1) luzReset(); else luzZoom(2.5, ev.clientX, ev.clientY); };
  const pts=new Map(); let pinch=null;
  pal.onpointerdown=ev=>{ pal.setPointerCapture(ev.pointerId); pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY}); if(pts.size===1) LUZ.drag={x:ev.clientX-LUZ.x,y:ev.clientY-LUZ.y}; else if(pts.size===2){ const [p1,p2]=[...pts.values()]; pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y), s:LUZ.s}; LUZ.drag=null; } };
  pal.onpointermove=ev=>{ if(!pts.has(ev.pointerId)) return; pts.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pinch && pts.size===2){ const [p1,p2]=[...pts.values()]; const d=Math.hypot(p1.x-p2.x,p1.y-p2.y); luzZoom((pinch.s*d/pinch.d)/LUZ.s,(p1.x+p2.x)/2,(p1.y+p2.y)/2); return; }
    if(LUZ.drag && LUZ.s>1){ LUZ.x=ev.clientX-LUZ.drag.x; LUZ.y=ev.clientY-LUZ.drag.y; luzAplica(); } };
  pal.onpointerup=pal.onpointercancel=ev=>{ pts.delete(ev.pointerId); if(pts.size<2) pinch=null; if(!pts.size) LUZ.drag=null; };
  pal.onclick=ev=>{ if(ev.target===pal && LUZ.s===1){ M.luz=null; renderConversa(v); } };
}
addEventListener("keydown",ev=>{
  if(M.luz==null || !M.proj) return;
  if(ev.key==="Escape"){ ev.stopImmediatePropagation(); M.luz=null; renderConversa($("#view-mesa")); }
  else if(ev.key==="ArrowRight") luzVai(1); else if(ev.key==="ArrowLeft") luzVai(-1);
  else if(ev.key==="+"||ev.key==="=") luzZoom(1.25); else if(ev.key==="-") luzZoom(1/1.25); else if(ev.key==="0") luzReset();

function sahraMsg(t,q,padrao){ if(!t&&!(q&&q.length)) t=padrao||""; return {r:"sahra",t:t||"",q:q||[],ts:new Date().toISOString()}; }
async function turno(texto, files){
  const p=M.proj; if(!p||M.busy) return;
  M.busy=true; M.erro="";
  let ids=[]; const blobs=files.map(x=>x.file);
  if(texto!==null){
    if(M.assets){ for(const x of files){ try{ const r=await M.assets.upload(x.file); ids.push(r.id); M.blobUrls[r.id]=x.url; }catch(err){ const tmp="tmp-"+Math.random().toString(36).slice(2); M.blobUrls[tmp]=x.url; ids.push(tmp); } } }
    else { for(const x of files){ const tmp="tmp-"+Math.random().toString(36).slice(2); M.blobUrls[tmp]=x.url; ids.push(tmp); } }
    p.mensagens.push({r:"cliente",t:texto,img:ids,ts:new Date().toISOString()});
  }
  const antes=p.mensagens.length;
  pararVoz();
  renderConversa($("#view-mesa"));
  let modo = texto===null ? "início do atendimento: apresente-se em uma frase e comece esta etapa." : "o cliente acabou de responder (última mensagem do histórico).";
  let primeira=true;
  try{
    for(let hop=0; hop<6; hop++){
      const e=etapaPorId(p.etapaId); if(!e){ alertaMesa("A etapa atual não existe mais no fluxo."); break; }
      M.ctl=new AbortController();
      const opts={cache:false, signal:M.ctl.signal};
      if(primeira && blobs.length && M.imgLimits) opts.images=blobs.slice(0,M.imgLimits.maxCount);
      const res=await M.sample.json(montarPrompt(e,modo,primeira?blobs.length:0), opts);
      primeira=false;
      if(res && typeof res.ficha==="object" && res.ficha && !Array.isArray(res.ficha)){ Object.assign(p.ficha,res.ficha); aplicaCamposEspeciais(p,res.ficha); }
      let saida=res?.saida; const msg=String(res?.mensagem||"").trim();
      { const c=Number(res?.completude); if(Number.isFinite(c)) p.completude=Math.max(0,Math.min(100,c)); }
      const pergs=Array.isArray(res?.perguntas)?res.perguntas.map(x=>String(x).trim()).filter(Boolean).slice(0,2):[];
      const idxs=(Array.isArray(saida)?saida:(saida===null||saida===undefined?[]:[saida])).map(Number).filter(i=>Number.isInteger(i)&&e.saidas?.[i]);
      if(!idxs.length){ p.mensagens.push(sahraMsg(msg,pergs,"Pode me contar um pouco mais?")); break; }
      const destinos=idxs.map(i=>e.saidas[i].destino).filter(Boolean);
      const cond=idxs.map(i=>e.saidas[i].condicao||String.fromCharCode(65+i)).join(" + ");
      const d=destinos[0]||"";
      const paraNome = destinos.map(nomeDestino).join(", ");
      p.trilha.push({de:`${codigo(e)} ${e.nome}`,saida:cond,para:paraNome,motivo:res.motivo||""});
      p.mensagens.push({r:"trace",t:`<b>${esc(codigo(e))}</b> ${esc(e.nome)} → ${esc(cond)}${paraNome?" → "+esc(paraNome):""}`});
      if(!d || d==="__cliente"){ p.mensagens.push(sahraMsg(msg,pergs,"Pode me contar um pouco mais?")); break; }
      if(d==="__revisao"){ p.pendencias.push({etapa:`${codigo(e)} ${e.nome}`,motivo:res.motivo||cond});
        p.mensagens.push(sahraMsg(msg,pergs,"Vou confirmar um detalhe técnico com a equipe e já volto com você sobre isso.")); break; }
      if(d==="__fim"){ p.status="concluido"; if(msg||pergs.length) p.mensagens.push(sahraMsg(msg,pergs)); break; }
      if(msg||pergs.length) p.mensagens.push(sahraMsg(msg,pergs));
      const extras=destinos.slice(1).filter(x=>!x.startsWith("__")&&etapaPorId(x));
      if(extras.length) p.fila.unshift(...extras);
      let next=d;
      if(ehFinal(d)){
        p.depois=d;
        if(p.fila.length){ next=p.fila.shift(); }
        else { p.status="briefing_concluido"; p.etapaId=d;
          if(!msg) p.mensagens.push({r:"sahra",t:"Perfeito, tenho tudo o que preciso pra começar a desenhar o seu projeto. Vou preparar a proposta e te mostro em seguida!",ts:new Date().toISOString()});
          break; }
      }
      if(!etapaPorId(next)){ alertaMesa("Uma saída aponta pra uma etapa que não existe."); break; }
      modo=`a conversa acabou de chegar nesta etapa, vinda de "${codigo(e)} ${e.nome}". Use a ficha: se ela já responde a decisão, decida direto; senão, comece esta etapa com o cliente.`;
      p.etapaId=next; p.completude=0;
    }
  }catch(err){
    const c=err?.code;
    if(c==="cancelled") alertaMesa("Resposta interrompida.");
    else if(c==="not_granted"||c==="sampling_disabled") alertaMesa("A SAHRA não tem permissão pra conversar nesta visualização.");
    else if(c==="rate_limited") alertaMesa("Muitas mensagens seguidas. Espere um pouco e envie de novo.");
    else if(c==="invalid_json") alertaMesa("A SAHRA respondeu fora do formato. Envie de novo.");
    else if(c==="image_rejected") alertaMesa("Uma das imagens não foi aceita. Tente outra foto.");
    else alertaMesa("A conversa falhou agora. Envie de novo.");
  }
  M.busy=false; M.ctl=null;
  falar(p.mensagens.slice(antes).filter(m=>m.r==="sahra").map(m=>[m.t,...(m.q||[])].filter(Boolean).join(" ")).join(" "));
  await salvarProj();
  renderConversa($("#view-mesa"));
  if(M.erro) alertaMesa(M.erro);
  // briefing fechou agora → ela segue sozinha pro projeto virtual, na mesma conversa
  if(p.status==="briefing_concluido" && !p.pv && !M.erro) gerarPV("", {chat:true});
}

/* ---------- Enquanto ela pensa: curiosidades, dicas e novidades (2026-11-08) ----------
   Matt: "enquanto ela pensa e ninguém está falando, ela contar algumas
   curiosidades sobre design, ou as últimas novidades… com botão ativar ou
   desativar… ela não precisa pensar, só fala o que já está escrito".
   Textos em sahra-curiosidades.json (editável). Nada vai pra IA nem fica
   salvo na conversa: é um balão temporário que some quando a resposta chega.
   Fala depois de 6 s de espera, no máximo 1 a cada 30 s, sem repetir. */
const CURI = {on:true, lista:null, aberturas:null, usados:new Set(), desde:0, ultima:0, atual:null};
try{ CURI.on = localStorage.getItem("sahra-fluxo-curi")!=="0"; }catch{}
const ICON_CURI='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>';
function curiHtml(){ return `<button class="btn vidro icone ${CURI.on?"":"off"}" id="curi-on" aria-pressed="${CURI.on}" aria-label="${CURI.on?"Curiosidades enquanto ela pensa: ligadas. Clique pra desligar":"Curiosidades enquanto ela pensa: desligadas. Clique pra ligar"}" title="${CURI.on?"Curiosidades enquanto ela pensa: ligadas":"Curiosidades: desligadas"}">${ICON_CURI}</button>`; }
function bindCuri(){ const b=$("#curi-on"); if(b) b.onclick=()=>{ CURI.on=!CURI.on; try{ localStorage.setItem("sahra-fluxo-curi",CURI.on?"1":"0"); }catch{} if(!CURI.on) tiraCuri(); b.outerHTML=curiHtml(); bindCuri(); }; }
async function carregaCuri(){
  if(CURI.lista) return;
  try{ const r=await fetch("sahra-curiosidades.json?v="+Date.now()); const j=await r.json();
    const hoje=new Date().toISOString().slice(0,10);
    CURI.lista=(j.falas||[]).filter(f=>f && f.texto && (!f.ate || f.ate>=hoje));
    CURI.aberturas=j.aberturas||{};
  }catch{ CURI.lista=[]; CURI.aberturas={}; }
}
function ocupado(){ return !!(M.busy||PV.busy||PV.rendering||PV.montando); }
function sorteiaCuri(){
  let pool=CURI.lista.filter((f,i)=>!CURI.usados.has(i));
  if(!pool.length){ CURI.usados.clear(); pool=CURI.lista.slice(); }
  // novidade tem um pouco mais de chance (é o que mais interessa)
  const pesos=pool.map(f=>f.tipo==="novidade"?2:1); let r=Math.random()*pesos.reduce((a,b)=>a+b,0);
  let f=pool[0]; for(let i=0;i<pool.length;i++){ r-=pesos[i]; if(r<=0){ f=pool[i]; break; } }
  CURI.usados.add(CURI.lista.indexOf(f));
  const ab=(CURI.aberturas[f.tipo]||["Enquanto eu penso:"]); const abre=ab[Math.floor(Math.random()*ab.length)];
  return abre+" "+f.texto;
}
function pintaCuri(){
  document.querySelectorAll(".fala-curi").forEach(el=>{ const t=(CURI.atual&&ocupado())?CURI.atual:""; el.textContent=t; el.hidden=!t; });
}
function tiraCuri(){ CURI.atual=null; pintaCuri(); }
setInterval(async()=>{
  if(!ocupado()){ CURI.desde=0; if(CURI.atual) tiraCuri(); return; }
  if(!CURI.desde) CURI.desde=Date.now();
  if(CURI.atual) pintaCuri(); // a tela redesenhou: põe o balão de volta
  if(!CURI.on || document.hidden) return;
  const agora=Date.now();
  if(agora-CURI.desde<6000 || agora-CURI.ultima<30000) return;
  await carregaCuri(); if(!CURI.lista.length || !ocupado()) return;
  CURI.ultima=agora; CURI.atual=sorteiaCuri(); pintaCuri();
  falar(CURI.atual, false, {curi:true});
}, 1000);

/* ---------- Conversa depois do briefing (2026-11-08) ----------

}

- "ajustar": o cliente quer mudar algo na proposta. Preencha "ajuste" com o pedido, claro e completo (ex.: "madeira mais clara nos nichos e adega 6 polegadas mais larga").
- "aprovar": o cliente aprovou a proposta como está (ex.: "aprovado", "gostei, pode seguir", "fechado").
- "render": o cliente quer ver como fica de verdade / imagem realista / foto da proposta. Se a casa está em construção (não existe foto do ambiente) ou o cliente pedir sem foto, mande também "sem_foto": true.

async function turnoPos(texto, files){
  const p=M.proj; if(!p||M.busy||PV.busy||PV.rendering||PV.montando) return;
  M.busy=true; M.erro="";
  const ids=[]; const blobs=files.map(x=>x.file);
  if(M.assets){ for(const x of files){ try{ const r=await M.assets.upload(x.file); ids.push(r.id); M.blobUrls[r.id]=x.url; }catch(err){ const tmp="tmp-"+Math.random().toString(36).slice(2); M.blobUrls[tmp]=x.url; ids.push(tmp); } } }
  else { for(const x of files){ const tmp="tmp-"+Math.random().toString(36).slice(2); M.blobUrls[tmp]=x.url; ids.push(tmp); } }
  p.mensagens.push({r:"cliente",t:texto,img:ids,ts:new Date().toISOString()});
  pararVoz(); renderConversa($("#view-mesa"));
  let res=null;
  try{
    M.ctl=new AbortController();
    const opts={cache:false, signal:M.ctl.signal};
    if(blobs.length && M.imgLimits) opts.images=blobs.slice(0,M.imgLimits.maxCount);
    res=await M.sample.json(promptPos(p, blobs.length), opts);
  }catch(err){
    alertaMesa(err?.code==="cancelled"?"Resposta interrompida.":"A conversa falhou agora. Envie de novo.");
  }
  M.busy=false; M.ctl=null;
  if(!res){ await salvarProj(); renderConversa($("#view-mesa")); return; }
  if(res.ficha && typeof res.ficha==="object" && !Array.isArray(res.ficha)){ Object.assign(p.ficha,res.ficha); aplicaCamposEspeciais(p,res.ficha); }
  let acao=String(res.acao||"conversa");
  const msg=String(res.mensagem||"").trim();
  const pergs=Array.isArray(res.perguntas)?res.perguntas.map(x=>String(x).trim()).filter(Boolean).slice(0,1):[];
  if(acao==="ajustar" && !p.pv) acao="gerar";
  if(acao==="montar" && !p.pv) acao="gerar";
  if(acao==="aprovar" && !p.pv) acao="conversa";
  if(acao==="render" && !p.pv?.proposta?.prompt_render) acao=p.pv?"conversa":"gerar";
  if(acao==="render" && (res.sem_foto===true || !p.mensagens.some(m=>(m.img||[]).length))) PV.fotoRender=RENDER_DO_PROJETO;
  if(acao==="montar" && !p.pv?.aprovado){ acao="conversa"; p.mensagens.push(sahraMsg(msg||"Antes de montar no portal, preciso da sua aprovação.",["Posso considerar a proposta aprovada?"])); }
  else if(acao==="aprovar"){ aprovarPV(); }
  else if(msg || pergs.length || acao==="conversa") p.mensagens.push(sahraMsg(msg,pergs,"Pode me contar um pouco mais?"));
  falar([msg,...pergs].join(" "));
  await salvarProj(); renderConversa($("#view-mesa"));
  if(acao==="gerar") await gerarPV("", {chat:true});
  else if(acao==="ajustar") await gerarPV(String(res.ajuste||texto), {chat:true});
  else if(acao==="render"){ if(PV.fotoRender!==RENDER_DO_PROJETO && !p.mensagens.flatMap(m=>m.img||[]).includes(PV.fotoRender)) PV.fotoRender=p.mensagens.flatMap(m=>m.img||[]).filter(id=>M.blobUrls[id]).at(-1)||RENDER_DO_PROJETO; await gerarRender(); }
  else if(acao==="montar") await montarNoPortal();
}

async function blobsDoProjeto(p){
  const ids=p.mensagens.flatMap(m=>m.img||[]).slice(-(M.imgLimits?.maxCount||0));
  const out=[];
  for(const id of ids){ try{ const r=await fetch(imgSrc(id)); if(r.ok) out.push(await r.blob()); }catch{} }
  return out.filter(b=>(M.imgLimits?.mediaTypes||[]).includes(b.type));
}
function conferirGeometria(pr){
  const avisos=[];
  for(const w of pr.paredes||[]){
    const it=(w.itens||[]).filter(i=>i.tipo!=="existente");
    for(const i of it){
      if(i.x<-0.5 || i.x+i.largura>w.largura+0.5) avisos.push(`${w.nome}: ${i.rotulo||i.sku} passa da largura da parede (${w.largura}").`);
      if(i.y+i.altura>w.altura+0.5) avisos.push(`${w.nome}: ${i.rotulo||i.sku} passa do pé-direito (${w.altura}").`);
    }
    for(let a=0;a<it.length;a++) for(let b=a+1;b<it.length;b++){
      const A=it[a],B=it[b]; if(A.tipo==="painel"||B.tipo==="painel") continue;
      const ox=Math.min(A.x+A.largura,B.x+B.largura)-Math.max(A.x,B.x), oy=Math.min(A.y+A.altura,B.y+B.altura)-Math.max(A.y,B.y);
      if(ox>0.5&&oy>0.5) avisos.push(`${w.nome}: ${A.rotulo||A.sku} e ${B.rotulo||B.sku} se sobrepõem.`);
    }
  }
  return avisos;
}
async function gerarPV(ajuste, o={}){

    const imgs = M.imgLimits ? await blobsDoProjeto(p) : [];
    PV.ctl=new AbortController();
    const opts={cache:false, signal:PV.ctl.signal, modelTier:"complex"};
    if(imgs.length) opts.images=imgs;
    const res=await M.sample.json(pvPrompt(p, ajuste, imgs.length), opts);
    if(!res || !Array.isArray(res.paredes)) throw {code:"invalid_json"};
    const vsAntes=versoesPV(p); const n=(vsAntes.at(-1)?.v||0)+1; const quando=new Date().toISOString();
    const hist=[...(p.pv?.historico||[])]; if(p.pv?.proposta) hist.push({quando:p.pv.quando, ajuste:ajuste||""});
    const vAnt=vsAntes.at(-1)?.v||0;
    p.pv={proposta:res, quando, avisos:conferirGeometria(res), historico:hist.slice(-5), aprovado:false,
      versoes:[...vsAntes, {v:n, quando, ajuste:ajuste||"", proposta:res}].slice(-6),
      renders:(p.pv?.renders||[]).map(r=>({...r, v:r.v||vAnt})), montagens:p.pv?.montagens||[]};
    M.ver={k:"pv", v:n}; M.aba="arquivos";
    if(ajuste && !o.chat) p.mensagens.push({r:"cliente",t:"Ajuste no projeto virtual: "+ajuste,ts:new Date().toISOString()});
    const versao=n;
    p.mensagens.push({r:"trace",t:`<b>Projeto virtual</b> → ${ajuste?"versão "+versao+" (ajuste)":"proposta montada"}`});
    const perg = "Quer mudar alguma coisa ou posso considerar aprovado?";
    p.mensagens.push(sahraMsg(String(res.mensagem||"Prontinho, aqui está a proposta."),[perg]));
    p.mensagens.push({r:"card",k:"pv",v:versao,ts:new Date().toISOString()});
    falar(String(res.mensagem||"")+" "+perg);
    await salvarProj();
  }catch(err){
    const c=err?.code;
    PV.erro = c==="cancelled"?"Geração interrompida.": c==="invalid_json"?"A proposta veio fora do formato. Tente de novo.": c==="rate_limited"?"Muitas chamadas seguidas. Espere um pouco e tente de novo.": c==="prompt_too_large"?"A conversa ficou grande demais pra gerar. Tente num projeto novo.":"Não foi possível gerar a proposta agora. Tente de novo.";

async function svgParaJpeg(svg, W){
  W=W||1400;
  let t=String(svg||""); if(!t) return null;
  if(!/xmlns=/.test(t)) t=t.replace("<svg",'<svg xmlns="http://www.w3.org/2000/svg"');
  t=t.replace(/var\(--muted\)/g,"#6c6860").replace(/var\(--[a-z-]+\)/g,"#3b3631");
  const vb=((t.match(/viewBox="([^"]+)"/)||[])[1]||"").split(/[\s,]+/).map(Number);
  const ratio=(vb.length===4&&vb[2]>0)?vb[3]/vb[2]:0.6;
  const url=URL.createObjectURL(new Blob([t],{type:"image/svg+xml"}));
  try{
    const img=new Image(); await new Promise((ok,er)=>{ img.onload=ok; img.onerror=er; img.src=url; });
    const c=document.createElement("canvas"); c.width=W; c.height=Math.max(1,Math.round(W*ratio));
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85).split(",")[1];
  }catch{ return null; } finally{ URL.revokeObjectURL(url); }
}

  const cp=$("#pv-copiar"); if(cp) cp.onclick=async()=>{ const t=$("#pv-prompt").textContent; const ok=$("#pv-copiado"); try{ await navigator.clipboard.writeText(t); ok.textContent="Copiado."; }catch{ const r=document.createRange(); r.selectNodeContents($("#pv-prompt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); ok.textContent="Texto selecionado: use Ctrl+C."; } };
  const a=$("#pv-aprovar"); if(a) a.onclick=async()=>{ aprovarPV(); await salvarProj(); renderConversa($("#view-mesa")); };
}

/* ---------- Microfone (reconhecimento de voz do navegador, mesmo jeito da SAHRA do portal) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SILENCIO_MS = 2000;
const MIC = {rec:null, gravando:false, timer:null, parar:false};
function pintaMic(){
  const b=$("#mic"); if(b){ b.classList.toggle("rec",MIC.gravando); b.setAttribute("aria-pressed",MIC.gravando); b.title=MIC.gravando?"Ouvindo… fique 2 s em silêncio pra enviar (ou toque de novo)":"Falar com a SAHRA"; }
  const t=$("#txt"); if(t) t.placeholder=MIC.gravando?"Ouvindo… fique 2 s em silêncio pra enviar":"Responda à SAHRA…";
}
function alternaMic(){
  if(MIC.gravando){ MIC.parar=true; clearTimeout(MIC.timer); try{ MIC.rec.stop(); }catch{} return; }
  if(!SR || M.busy) return;
  pararVoz();
  const inp=$("#txt"); const base=inp && inp.value ? inp.value.trim()+" " : "";
  let acumulado="", falado="", encerrado=false;
  MIC.parar=false;
  const arma=(ms)=>{ clearTimeout(MIC.timer); MIC.timer=setTimeout(()=>{ MIC.parar=true; try{ MIC.rec.stop(); }catch{} }, ms||SILENCIO_MS); };
  const inicia=()=>{
    let finSessao="";
    const r=MIC.rec=new SR();
    r.lang="pt-BR"; r.interimResults=true; r.continuous=true;
    r.onresult=(ev)=>{
      if(encerrado || r!==MIC.rec) return;
      let fin="", tmp="";
      for(let i=0;i<ev.results.length;i++){ if(ev.results[i].isFinal) fin+=ev.results[i][0].transcript; else tmp+=ev.results[i][0].transcript; }
      finSessao=fin; falado=acumulado+fin;
      const t=$("#txt"); if(t) t.value=base+acumulado+fin+tmp;
      arma();
    };
    r.onerror=(ev)=>{
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed"||ev.error==="audio-capture"){ MIC.parar=true; alertaMesa("O navegador bloqueou o microfone. Libere o microfone pra este site (cadeado ao lado do endereço) ou abra a tela em nova aba."); }
    };
    r.onend=()=>{
      if(encerrado || r!==MIC.rec) return;
      if(finSessao.trim()) acumulado=(acumulado+finSessao).trim()+" ";
      if(!MIC.parar){ try{ inicia(); return; }catch{} }
      clearTimeout(MIC.timer); encerrado=true; MIC.gravando=false; pintaMic();
      const t=$("#txt");
      if(falado.trim() && t){ t.value=(base+falado).trim(); enviar(); }
    };
    r.start();
  };
  try{ inicia(); MIC.gravando=true; pintaMic(); arma(SILENCIO_MS*2); }
  catch(e){ MIC.gravando=false; pintaMic(); alertaMesa("Não consegui ligar o microfone: "+(e?.message||e)); }
}

/* ---------- Voz (Gemini TTS, a mesma voz Aoede da SAHRA do portal, via sahra-chat) ---------- */
const VOZ = {on:true, audio:null, seq:0};
try{ const v=JSON.parse(localStorage.getItem("sahra-fluxo-voz")||"{}"); if(typeof v.on==="boolean") VOZ.on=v.on; }catch{}
function guardarVoz(){ try{ localStorage.setItem("sahra-fluxo-voz",JSON.stringify({on:VOZ.on})); }catch{} }
function vozInfo(t){ const el=$("#voz-info"); if(el) el.textContent=t; }
function vozHtml(){ return `<button class="btn vidro icone" id="voz-on" aria-pressed="${VOZ.on}" aria-label="${VOZ.on?"Voz ligada: clique pra desligar":"Voz desligada: clique pra ligar"}" title="${VOZ.on?"Voz ligada":"Voz desligada"}">${VOZ.on?ICON_VOZ_ON:ICON_VOZ_OFF}</button>`; }
const ICON_VOZ_ON='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>', ICON_VOZ_OFF='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function bindVoz(){
  const b=$("#voz-on"); if(b) b.onclick=()=>{ VOZ.on=!VOZ.on; guardarVoz(); if(!VOZ.on) pararVoz(); b.outerHTML=vozHtml(); bindVoz(); };
}
function pararVoz(){ VOZ.seq++; try{ VOZ.audio?.pause(); }catch{} VOZ.audio=null; }
function pcmParaWav(b64){
  const bin=atob(b64); const pcm=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) pcm[i]=bin.charCodeAt(i);
  const rate=24000, buf=new ArrayBuffer(44+pcm.length), v=new DataView(buf);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4,36+pcm.length,true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,pcm.length,true);
  new Uint8Array(buf,44).set(pcm); return new Blob([buf],{type:"audio/wav"});
}
// CURIOSIDADE TERMINA ANTES DA RESPOSTA (20:45, 08/11, Matt: "quando ela tá
// dando a dica enquanto pensa, deixa ela acabar; depois da dica ela fala o
// que tem que falar"). A fala da curiosidade não é cortada pela resposta:
// a resposta é preparada em paralelo e toca quando a dica termina. Se a dica
// ainda nem começou a tocar, ela é cancelada (pra não atrasar a resposta).
const curiTocando=()=>!!(VOZ.curiAudio && !VOZ.curiAudio.paused && !VOZ.curiAudio.ended);
async function falar(texto, forcar, opts){
  const curi=!!(opts&&opts.curi);
  if(!texto || (!VOZ.on && !forcar)) return;
  if(curi && VOZ.audio && !VOZ.audio.paused && !VOZ.audio.ended) return; // não interrompe nada pra contar curiosidade
  const esperar=!curi && curiTocando();
  if(!esperar) pararVoz();
  const meu=++VOZ.seq;
  if(forcar) vozInfo("Preparando a voz…");
  try{
    const { data, error } = await supabaseClient.functions.invoke("sahra-chat", { body:{ tts:String(texto).slice(0,2500), lang:"pt", voice:"Aoede" } });
    if(error || !data?.audio) throw new Error(data?.error || error?.message || "sem áudio");
    if(meu!==VOZ.seq) return;
    const blob=/^audio\/(wav|mpeg|mp3|ogg)/i.test(data.mime||"") ? new Blob([Uint8Array.from(atob(data.audio),c=>c.charCodeAt(0))],{type:data.mime}) : pcmParaWav(data.audio);
    if(!curi && curiTocando()){
      const c=VOZ.curiAudio;
      await new Promise(ok=>{ c.addEventListener("ended",ok,{once:true}); c.addEventListener("pause",ok,{once:true}); setTimeout(ok,45000); });
      if(meu!==VOZ.seq) return;
    }
    const a=new Audio(URL.createObjectURL(blob)); VOZ.audio=a;
    if(curi){ VOZ.curiAudio=a; a.addEventListener("ended",()=>{ if(VOZ.curiAudio===a) VOZ.curiAudio=null; },{once:true}); }
    await a.play();
    if(forcar) vozInfo("");
  }catch(e){ if(forcar) vozInfo("A voz não respondeu agora: "+(e?.message||e)); }
}

/* ---------- Adaptador Supabase (tabelas sahra_fluxo_*, migration 271) ---------- */
const TAB = {grupos:"sahra_fluxo_grupos", etapas:"sahra_fluxo_etapas", projetos:"sahra_fluxo_projetos"};
const ouvintes = {grupos:[], etapas:[], projetos:[]};
function novoId(){ return (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2))); }
function linhaParaDoc(col,r){
  if(col==="projetos"){ const {dados, titulo, criado, atualizado}=r; return {...(dados||{}), titulo, criado, atualizado}; }
  const {id, ...rest}=r; return rest;
}
function docParaLinha(col,id,obj,parcial){
  if(col==="projetos"){
    const {titulo, criado, atualizado, ...dados}=obj;
    const row={dados, atualizado:new Date().toISOString()}; if(titulo!==undefined) row.titulo=titulo;
    if(!parcial) row.id=id; return row;
  }
  const row={...obj}; if(!parcial) row.id=id;
  if(col==="etapas") row.atualizado=new Date().toISOString();
  return row;
}
async function recarregar(col){
  const q=supabaseClient.from(TAB[col]).select("*");
  const { data, error } = col==="projetos" ? await q.order("atualizado",{ascending:false}).limit(200) : await q;
  if(error){ ouvintes[col].forEach(o=>o.err&&o.err(error)); return; }
  let docs=(data||[]).map(r=>({id:String(r.id), data:()=>linhaParaDoc(col,r)}));
  if(col==="grupos") docs.sort((a,b)=>(a.data().ordem||0)-(b.data().ordem||0));
  const snap={docs, size:docs.length, metadata:{fromCache:false}};
  ouvintes[col].forEach(o=>o.cb(snap));
}
function refDoc(path){
  const [col,id]=path.split("/");
  return {
    id,
    async set(obj){ const { error } = await supabaseClient.from(TAB[col]).upsert(docParaLinha(col,id,obj,false)); if(error) throw error; recarregar(col); },
    async update(obj){
      let row=docParaLinha(col,id,obj,true);
      if(col==="projetos"){ const atual=(await supabaseClient.from(TAB[col]).select("dados").eq("id",id).single()).data?.dados||{}; row.dados={...atual,...row.dados}; }
      const { error } = await supabaseClient.from(TAB[col]).update(row).eq("id",id); if(error) throw error; recarregar(col);
    },
    async delete(){ const { error } = await supabaseClient.from(TAB[col]).delete().eq("id",id); if(error) throw error; recarregar(col); }
  };
}
const dbSupabase = {
  doc: refDoc,
  collection(col){
    const api={
      doc(){ return refDoc(col+"/"+novoId()); },
      orderBy(){ return api; },
      onSnapshot(cb, err){ ouvintes[col].push({cb,err}); recarregar(col); return ()=>{}; }
    };
    return api;
  }
};
// IA: Edge Function sahra-fluxo (Gemini). Mesma "cara" do sample do protótipo.
async function blobParaBase64(b){ return await new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=no; r.readAsDataURL(b); }); }
const sampleSupabase = {
  async limits(){ return {images:{maxCount:6, mediaTypes:["image/jpeg","image/png","image/webp","image/gif"]}}; },
  async json(prompt, opts={}){
    const images=[]; for(const b of (opts.images||[])) images.push({mime:b.type||"image/jpeg", data:await blobParaBase64(b)});
    let resp;
    try{ resp = await supabaseClient.functions.invoke("sahra-fluxo", {body:{acao:"json", prompt, images, modo:opts.modelTier==="complex"?"profundo":"leve"}, signal:opts.signal}); }
    catch(e){ if(e?.name==="AbortError") throw {code:"cancelled"}; throw {code:"network", message:e?.message}; }
    const { data, error } = resp;
    if(opts.signal?.aborted) throw {code:"cancelled"};
    if(error){ let corpo=null; try{ corpo=await error.context?.json(); }catch{} throw {code: corpo?.code==="forbidden"?"not_granted": corpo?.code==="timeout"?"timeout":"falhou", message: corpo?.error||error.message}; }
    if(!data || typeof data.data!=="object") throw {code:"invalid_json"};
    return data.data;
  }
};
// Fotos: comprimidas (JPEG até 1600 px) e guardadas em sahra_fluxo_fotos.
async function comprimir(file, max=1600){
  const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
  const k=Math.min(1, max/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.85);
}
const assetsSupabase = {
  async upload(file){
    const data_url=await comprimir(file);
    const { data, error } = await supabaseClient.from("sahra_fluxo_fotos").insert({projeto_id:M.pid||null, tipo:"foto", data_url}).select("id").single();
    if(error) throw error; M.blobUrls[data.id]=data_url; return {id:data.id};
  }
};
async function carregarFotos(ids){
  const faltam=[...new Set(ids)].filter(id=>id && !M.blobUrls[id] && !String(id).startsWith("tmp-"));
  if(!faltam.length) return false;
  const { data } = await supabaseClient.from("sahra_fluxo_fotos").select("id,data_url").in("id",faltam);
  (data||[]).forEach(r=>{ M.blobUrls[r.id]=r.data_url; });
  return !!(data||[]).length;
}

async function start(){
  M.dbChecked=true;
  if(typeof supabaseClient==="undefined"){ setStatus(""); $("#board").innerHTML=`<div class="empty" style="flex:1"><h2>Sem conexão com o portal</h2><p>Abra esta tela pelo botão SAHRA · Fluxo dentro do portal.</p></div>`; route(); return; }
  const { data:{ session } } = await supabaseClient.auth.getSession();
  let admin=false;
  if(session){ const r=await supabaseClient.rpc("is_admin"); admin=!r.error && r.data===true; }
  if(!admin){ setStatus(""); $("#board").innerHTML=`<div class="empty" style="flex:1"><h2>Só administrador</h2><p>Entre no portal com uma conta de administrador e abra de novo.</p></div>`; route(); return; }
  const db=dbSupabase;
  st.db=db;
  const timer=setTimeout(()=>setStatus("Não foi possível alcançar o fluxo ainda. Verifique a conexão."),10000);
  const ok=(k)=>(snap)=>{ clearTimeout(timer); setStatus("Sincronizado"); st.loaded[k]=true; };
  const erro=(e)=>{ clearTimeout(timer); setStatus(/relation|does not exist|schema cache/i.test(e?.message||"")?"Tabelas não encontradas: rode a migration 271 no Supabase.":"Erro ao carregar o fluxo."); };
  const rerender=()=>{ if(!$("#view-mesa").hidden){ if(!M.busy && !PV.busy && (!M.pid || !$("#txt") )) renderMesa(); } else if(!st.dirty) render(); };
  db.collection("grupos").orderBy("ordem").onSnapshot(s=>{ st.grupos=s.docs.map(d=>({id:d.id,...d.data()})); ok("g")(s); rerender(); }, erro);
  db.collection("etapas").onSnapshot(s=>{ st.etapas=s.docs.map(d=>({id:d.id,...d.data()})); ok("e")(s);
      if(st.sel && !st.dirty){ const e=st.etapas.find(x=>x.id===st.sel); if(e) st.draft=draftDe(e); }
      rerender(); }, erro);
  db.collection("projetos").onSnapshot(s=>{ M.projetos=s.docs.map(d=>({id:d.id,...d.data()})); rerender(); }, ()=>{});
  M.assets=assetsSupabase;
  M.sample=sampleSupabase;
  M.imgLimits=(await M.sample.limits()).images;
  route();
}
route();
start();
