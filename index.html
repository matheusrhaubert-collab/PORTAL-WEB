<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Legno — Portal do Cliente</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- index.html é a página raiz do site (GitHub Pages, e qualquer host
     estático, serve este arquivo por padrão em "/"). O portal de verdade
     mora em portal.html — este arquivo só redireciona pra lá, pra quem
     visitar a raiz do repositório/domínio já cair direto no portal.
     A calculadora avulsa antiga (single-módulo, sem carrinho/login/i18n)
     foi movida pra calculadora-legado.html, sem apagar nada. -->
<meta http-equiv="refresh" content="0; url=portal.html" />
<script>window.location.replace('portal.html');</script>
</head>
<body>
  <p>Redirecionando para o <a href="portal.html">Portal do Cliente</a>…</p>
</body>
</html>
