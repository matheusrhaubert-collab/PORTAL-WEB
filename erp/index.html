<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- O HTML NUNCA FICA EM CACHE (2026-08-16). Matt: "só com F5 consigo ver".
     Os .js e .css já têm ?v= e podem (devem) ser cacheados pra sempre — mas
     quem carrega o ?v= NOVO é este arquivo. Se ele próprio vem do cache, o
     deploy não chega no navegador e o único jeito de ver a versão nova é o
     usuário lembrar de dar F5 — que é pedir pra alguém rodar a versão velha
     sem saber, num sistema que manda arquivo pra máquina de furar.
     Este HTML é pequeno (uns 12 KB): buscar sempre custa quase nada, e é o
     que faz o ?v= dos outros arquivos valer de alguma coisa. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Legno ERP</title>
<!-- adm.css é gerado de css/style.css com tudo preso a .adm-scope
     (scripts/gerar-adm-css.js). Vem ANTES do erp.css: se algum dia escapar
     um seletor solto, quem ganha é o ERP. -->
<link rel="stylesheet" href="css/adm.css?v=202609242251">
<link rel="stylesheet" href="css/erp.css?v=202609242251">

     secoes recolhiveis e ajuda atras do "?". Classes .cad-* sao novas e nao
     colidem com o admin antigo. -->
<link rel="stylesheet" href="css/cadastro.css?v=202609242251">
</head>
<body>

<!-- Tela de login — some assim que a sessão é válida -->
<div class="erp-login" id="erp-login" hidden>
  <form class="erp-login-box" id="erp-login-form">
    <div class="erp-login-brand">LEGNO</div>
    <div class="erp-login-sub">ERP Fabricação</div>
    <label class="erp-field"><span>E-mail</span>
      <input type="email" id="erp-login-email" autocomplete="username" required></label>
    <label class="erp-field"><span>Senha</span>
      <input type="password" id="erp-login-pass" autocomplete="current-password" required></label>
    <button type="submit" class="erp-btn-lg" style="width:100%;justify-content:center" id="erp-login-btn">Entrar</button>
    <div class="erp-login-msg" id="erp-login-msg"></div>
    <div class="erp-login-foot">Mesmo login do portal. O acesso ao ERP exige estar na allow-list de admin.<br>
      <a href="diagnostico.html" style="color:var(--accent-dark)">Não está funcionando? Abrir diagnóstico</a></div>
  </form>
</div>

<div id="erp-app" hidden>
  <header class="erp-topbar">
    <div class="erp-brand">
      <span class="erp-logo">LEGNO</span>
      <span class="erp-brand-sub">ERP Fabricação</span>
    </div>
    <nav class="erp-nav" id="erp-nav"></nav>
    <div class="erp-user">
      <span class="erp-user-name" id="erp-user-name"></span>
      <button class="erp-btn-ghost erp-btn-sm" id="erp-logout" style="color:rgba(255,255,255,.8)">Sair</button>
    </div>
  </header>
  <!-- Segunda faixa do menu: os módulos da área aberta. Fica vazia (e
       escondida) no Painel, que não tem submenu. -->
  <div class="erp-subnav" id="erp-subnav" hidden></div>
  <main id="erp-main"></main>

  <!-- Cadastros do antigo painel admin. As 14 telas são injetadas JUNTAS em
       #adm-root (js/adm/_adm.js explica por quê: elas populam <select> umas
       das outras) e o menu do ERP só decide qual fica visível.
       .adm-scope prende o css/adm.css a esta caixa — sem isso o estilo do
       portal repintaria o ERP inteiro. -->
  <section id="erp-adm-host" hidden>
    <div class="erp-adm-head">
      <div>
        <h1 id="erp-adm-title"></h1>
        <p class="erp-sub" id="erp-adm-sub"></p>
      </div>
      <div class="erp-page-actions">
        <button class="erp-btn-secondary" id="erp-adm-reload">Recarregar</button>
      </div>
    </div>
    <div id="erp-adm-aviso" hidden></div>
    <div class="adm-scope" id="adm-root"></div>
  </section>
</div>

<div class="erp-scan-overlay" id="erp-scan-overlay" hidden>
  <div class="erp-scan-box">
    <button class="erp-scan-close" id="erp-scan-close">&times;</button>
    <h3>Leitura de código</h3>
    <p class="erp-muted">Aponte o leitor ou digite o código. O leitor de mão se comporta como teclado — o campo já está focado.</p>
    <input type="text" id="erp-scan-input" placeholder="OP-0000-000 / PC-000000" autocomplete="off">
    <div class="erp-scan-result" id="erp-scan-result"></div>
  </div>
</div>
